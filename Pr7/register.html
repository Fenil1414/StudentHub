<main id="main-content"><section class="panel"><h2>Student Registration</h2><p>Enter your details. The server validates the form and stores accepted registrations in CSV and JSON files.</p>
<form action="process.php" method="post">
<div class="form-field"><label for="name">Full name *</label><input id="name" name="name" type="text" required minlength="2" maxlength="80"></div>
<div class="form-field"><label for="email">Email address *</label><input id="email" name="email" type="email" required maxlength="120"></div>
<div class="form-field"><label for="student_id">Student ID *</label><input id="student_id" name="student_id" type="text" required minlength="3" maxlength="30"></div>
<div class="form-field"><label for="course">Course *</label><select id="course" name="course" required><option value="">Select course</option><option>AIML</option><option>CSE</option><option>CE</option><option>IT</option></select></div>
<button type="submit">Submit Registration</button></form></section></main>
